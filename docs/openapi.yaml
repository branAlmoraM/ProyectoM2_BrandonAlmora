openapi: 3.0.0
info:
  title: MiniBlog API
  version: 1.0.0
  description: API REST para gestionar autores y publicaciones usando Node.js, Express y PostgreSQL.

servers:
  - url: http://localhost:3000
    description: Servidor local
  - url: https://proyectom2brandonalmora-production.up.railway.app/
    description: Servidor de producción

paths:
  /blog/authors:
    get:
      summary: Obtener todos los autores
      tags: [Authors]
      responses:
        "200":
          description: Lista de autores
        "500":
          description: Error del servidor

    post:
      summary: Crear un nuevo autor
      tags: [Authors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthor"
      responses:
        "201":
          description: Autor creado correctamente
        "400":
          description: Datos inválidos o email duplicado
        "500":
          description: Error del servidor

  /blog/authors/{id}:
    get:
      summary: Obtener autor por ID
      tags: [Authors]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Autor encontrado
        "404":
          description: Autor no encontrado
        "500":
          description: Error del servidor

    put:
      summary: Actualizar autor por ID
      tags: [Authors]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthor"
      responses:
        "200":
          description: Autor actualizado correctamente
        "400":
          description: Datos inválidos o email duplicado
        "404":
          description: Autor no encontrado
        "500":
          description: Error del servidor

    delete:
      summary: Eliminar autor por ID
      tags: [Authors]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Autor eliminado correctamente
        "404":
          description: Autor no encontrado
        "500":
          description: Error del servidor

  /blog/posts:
    get:
      summary: Obtener todos los posts
      tags: [Posts]
      parameters:
        - name: published
          in: query
          required: false
          schema:
            type: boolean
          description: Filtra posts publicados o no publicados
      responses:
        "200":
          description: Lista de posts
        "500":
          description: Error del servidor

    post:
      summary: Crear un nuevo post
      tags: [Posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePost"
      responses:
        "201":
          description: Post creado correctamente
        "400":
          description: Datos inválidos
        "404":
          description: Autor no encontrado
        "500":
          description: Error del servidor

  /blog/posts/{id}:
    get:
      summary: Obtener post por ID
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Post encontrado
        "404":
          description: Post no encontrado
        "500":
          description: Error del servidor

    put:
      summary: Actualizar post por ID
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePost"
      responses:
        "200":
          description: Post actualizado correctamente
        "400":
          description: Datos inválidos
        "404":
          description: Post no encontrado
        "500":
          description: Error del servidor

    delete:
      summary: Eliminar post por ID
      tags: [Posts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Post eliminado correctamente
        "404":
          description: Post no encontrado
        "500":
          description: Error del servidor

  /blog/posts/author/{authorId}:
    get:
      summary: Obtener posts por autor con detalle del author
      tags: [Posts]
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
          description: ID del autor
      responses:
        "200":
          description: Posts encontrados con información del autor
        "404":
          description: No se encontraron posts para este autor
        "500":
          description: Error del servidor

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID del recurso

  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Brandon Almora
        email:
          type: string
          example: brandon@email.com
        bio:
          type: string
          example: Desarrollador backend junior
        created_at:
          type: string
          format: date-time

    CreateAuthor:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: Brandon Almora
        email:
          type: string
          example: brandon@email.com
        bio:
          type: string
          example: Autor de MiniBlog

    UpdateAuthor:
      type: object
      properties:
        name:
          type: string
          example: Brandon actualizado
        email:
          type: string
          example: actualizado@email.com
        bio:
          type: string
          example: Bio actualizada

    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        author_id:
          type: integer
          example: 1
        title:
          type: string
          example: Primer post
        content:
          type: string
          example: Contenido del post
        published:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    CreatePost:
      type: object
      required:
        - author_id
        - title
        - content
      properties:
        author_id:
          type: integer
          example: 1
        title:
          type: string
          example: Nuevo post
        content:
          type: string
          example: Contenido del nuevo post
        published:
          type: boolean
          example: false

    UpdatePost:
      type: object
      properties:
        title:
          type: string
          example: Título actualizado
        content:
          type: string
          example: Contenido actualizado
        published:
          type: boolean
          example: true
